openapi: 3.0.3
info:
  title: Inventory API
  description: General-purpose datastore for AI agents. Every route except /health requires Authorization Bearer with an api key; the key resolves to a tenant, so tenantId is never a URL parameter.
  version: 0.2.0

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /tenant:
    get:
      operationId: getTenant
      summary: Return the caller's tenant
      responses:
        "200":
          description: The tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
    put:
      operationId: updateTenant
      summary: Rename the caller's tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdate"
      responses:
        "200":
          description: Tenant updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /kinds:
    get:
      operationId: listKinds
      summary: List kinds for the caller's tenant
      responses:
        "200":
          description: List of kinds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kind"
    post:
      operationId: createKind
      summary: Create a kind
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KindCreate"
      responses:
        "201":
          description: Kind created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kind"

  /kinds/{kindId}:
    parameters:
      - $ref: "#/components/parameters/KindId"
    get:
      operationId: getKind
      summary: Get a kind by id
      responses:
        "200":
          description: The kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kind"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateKind
      summary: Update a kind
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KindUpdate"
      responses:
        "200":
          description: Kind updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kind"
    delete:
      operationId: deleteKind
      summary: Soft-delete a kind
      responses:
        "204":
          description: Kind deleted

  /kinds/{kindId}/versions:
    parameters:
      - $ref: "#/components/parameters/KindId"
    get:
      operationId: listKindVersions
      summary: List versions for a kind
      responses:
        "200":
          description: List of kind versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KindVersion"
    post:
      operationId: createKindVersion
      summary: Create a new kind version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KindVersionCreate"
      responses:
        "201":
          description: Kind version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KindVersion"

  /kinds/{kindId}/models:
    parameters:
      - $ref: "#/components/parameters/KindId"
    get:
      operationId: listModels
      summary: List models for a kind
      responses:
        "200":
          description: List of models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Model"
    post:
      operationId: createModel
      summary: Create a model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelCreate"
      responses:
        "201":
          description: Model created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"

  /kinds/{kindId}/models/{slug}:
    parameters:
      - $ref: "#/components/parameters/KindId"
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getModel
      summary: Get a model by slug
      responses:
        "200":
          description: The model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateModel
      summary: Update a model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelUpdate"
      responses:
        "200":
          description: Model updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
    delete:
      operationId: deleteModel
      summary: Soft-delete a model
      responses:
        "204":
          description: Model deleted

components:
  parameters:
    KindId:
      name: kindId
      in: path
      required: true
      schema:
        type: string
        minLength: 20
        maxLength: 20
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string

    Tenant:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TenantUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string

    Kind:
      type: object
      required: [id, tenantId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    KindCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    KindUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    KindVersion:
      type: object
      required: [id, kindId, schema, createdAt, updatedAt]
      properties:
        id:
          type: string
        kindId:
          type: string
        schema:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    KindVersionCreate:
      type: object
      required: [schema]
      properties:
        schema:
          type: object
          additionalProperties: true

    Model:
      type: object
      required: [id, tenantId, kindId, kindVersionId, slug, body, createdAt, updatedAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        kindId:
          type: string
        kindVersionId:
          type: string
        slug:
          type: string
        body:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ModelCreate:
      type: object
      required: [slug, body]
      properties:
        slug:
          type: string
        kindVersionId:
          type: string
          description: If omitted, the latest version for the kind is used.
        body:
          type: object
          additionalProperties: true

    ModelUpdate:
      type: object
      required: [body]
      properties:
        kindVersionId:
          type: string
          description: If omitted, the latest version for the kind is used.
        body:
          type: object
          additionalProperties: true
