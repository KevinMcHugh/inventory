openapi: 3.0.3
info:
  title: Inventory API
  description: General-purpose datastore for AI agents. Every route except /health requires Authorization Bearer with an api key; the key resolves to a tenant, so tenantId is never a URL parameter.
  version: 0.2.0

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /tenant:
    get:
      operationId: getTenant
      summary: Return the caller's tenant
      responses:
        "200":
          description: The tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
    put:
      operationId: updateTenant
      summary: Rename the caller's tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdate"
      responses:
        "200":
          description: Tenant updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /kinds:
    get:
      operationId: listKinds
      summary: List kinds for the caller's tenant
      responses:
        "200":
          description: List of kinds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kind"
    post:
      operationId: createKind
      summary: Create a kind
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KindCreate"
      responses:
        "201":
          description: Kind created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kind"

  /kinds/{kindId}:
    parameters:
      - $ref: "#/components/parameters/KindId"
    get:
      operationId: getKind
      summary: Get a kind by id
      responses:
        "200":
          description: The kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kind"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateKind
      summary: Update a kind
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KindUpdate"
      responses:
        "200":
          description: Kind updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kind"
    delete:
      operationId: deleteKind
      summary: Soft-delete a kind
      responses:
        "204":
          description: Kind deleted

  /kinds/{kindId}/schema:
    parameters:
      - $ref: "#/components/parameters/KindId"
    get:
      operationId: getKindSchema
      summary: Return the latest schema authored for this kind
      responses:
        "200":
          description: Schema (empty document if the kind has no version yet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schema"
        "404":
          $ref: "#/components/responses/NotFound"

  /kinds/{kindId}/versions:
    parameters:
      - $ref: "#/components/parameters/KindId"
    get:
      operationId: listKindVersions
      summary: List versions for a kind
      responses:
        "200":
          description: List of kind versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KindVersion"
    post:
      operationId: createKindVersion
      summary: Create a new kind version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KindVersionCreate"
      responses:
        "201":
          description: Kind version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KindVersion"

  /kinds/{kindId}/models:
    parameters:
      - $ref: "#/components/parameters/KindId"
    get:
      operationId: listModels
      summary: List models for a kind
      responses:
        "200":
          description: List of models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Model"
    post:
      operationId: createModel
      summary: Create a model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelCreate"
      responses:
        "201":
          description: Model created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "400":
          $ref: "#/components/responses/BadRequest"

  /kinds/{kindId}/models/{slug}:
    parameters:
      - $ref: "#/components/parameters/KindId"
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getModel
      summary: Get a model by slug
      responses:
        "200":
          description: The model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateModel
      summary: Update a model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelUpdate"
      responses:
        "200":
          description: Model updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      operationId: deleteModel
      summary: Soft-delete a model
      responses:
        "204":
          description: Model deleted

components:
  parameters:
    KindId:
      name: kindId
      in: path
      required: true
      schema:
        type: string
        minLength: 20
        maxLength: 20
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string
        fields:
          type: array
          description: Present on 400 responses from writes that were rejected by schema validation. One entry per field that failed.
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    Tenant:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TenantUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string

    Kind:
      type: object
      required: [id, tenantId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    KindCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    KindUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    FieldType:
      type: string
      description: |
        The value shape of a body property. Drives cell rendering and
        per-column filter widgets on the frontend.
      enum: [text, number, integer, boolean, date, enum, url, tags]

    Field:
      type: object
      required: [key, type]
      properties:
        key:
          type: string
          description: The property name inside model.body.
        label:
          type: string
          description: Human-readable header. Falls back to key when omitted.
        type:
          $ref: "#/components/schemas/FieldType"
        pinned:
          type: boolean
          description: If true, the column is visible by default.
        required:
          type: boolean
          description: If true, model writes must supply a non-blank value for this field.
        indexed:
          type: boolean
          description: If true, values for this field are materialized into indexed_fields for efficient search and sort.
        values:
          type: array
          items:
            type: string
          description: Allowed values for enum-typed fields.
        min:
          type: number
          description: Lower bound hint for number/integer types.
        max:
          type: number
          description: Upper bound hint for number/integer types.
        unit:
          type: string
          description: Unit label rendered next to number values.

    Schema:
      type: object
      required: [fields]
      properties:
        version:
          type: integer
          description: Bumped whenever the schema shape itself changes.
        fields:
          type: array
          items:
            $ref: "#/components/schemas/Field"
          description: Array order drives display column order.

    KindVersion:
      type: object
      required: [id, kindId, schema, createdAt, updatedAt]
      properties:
        id:
          type: string
        kindId:
          type: string
        schema:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    KindVersionCreate:
      type: object
      required: [schema]
      properties:
        schema:
          type: object
          additionalProperties: true

    Model:
      type: object
      required: [id, tenantId, kindId, kindVersionId, slug, body, createdAt, updatedAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        kindId:
          type: string
        kindVersionId:
          type: string
        slug:
          type: string
        body:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ModelCreate:
      type: object
      required: [slug, body]
      properties:
        slug:
          type: string
        kindVersionId:
          type: string
          description: If omitted, the latest version for the kind is used.
        body:
          type: object
          additionalProperties: true

    ModelUpdate:
      type: object
      required: [body]
      properties:
        kindVersionId:
          type: string
          description: If omitted, the latest version for the kind is used.
        body:
          type: object
          additionalProperties: true
